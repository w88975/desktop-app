name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Build Windows installer
        working-directory: apps/electron
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Huaxiaozhu-Windows-x64-${{ github.sha }}
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 14
